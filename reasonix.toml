[permissions]
allow = ["Bash=mkdir -p /tmp/editxr-repro && cat > /tmp/editxr-repro/LinkWrapTests.swift <<'EOF'\nimport XCTest\n@testable import editxr\n\nfinal class LinkWrapTests: XCTestCase {\n    func testWrappedLinkOSC8BalancePerRow() {\n        let content = \"\"\"\n        Ver el [sitio oficial con un nombre muy largo que se corta](https://example.com/ruta/muy/larga) para mas info\n        segunda linea\n        \"\"\"\n        let tmp = NSTemporaryDirectory() + \"editxr-test-\\(UUID().uuidString).md\"\n        try? content.write(toFile: tmp, atomically: true, encoding: .utf8)\n        let state = EditorState(filePath: tmp)\n        state.wordWrap = true\n        state.blockMode = false\n        let clamped = 1\n        state.document.cursorLine = clamped\n        state.document.cursorColumn = 0\n        let app = EditorApp(states: [state])\n        let rows = app.renderContentLinesForTest(width: 30, height: 20)\n        for (i, row) in rows.enumerated() {\n            let opens = row.components(separatedBy: \"\\u{1B}]8;;\").count - 1\n            // count closes: \"ESC]8;;ESC\\\" is the close; opens are ESC]8;;uri ESC\\\n            var closes = 0\n            var j = 0\n            let chars = Array(row)\n            while j < chars.count {\n                if chars[j] == \"\\u{1B}\" && j + 1 < chars.count && chars[j+1] == \"]\" {\n                    // find terminator\n                    var k = j + 2\n                    var isClose = false\n                    var payload = \"\"\n                    while k < chars.count {\n                        if chars[k] == \"\\u{1B}\" && k + 1 < chars.count && chars[k+1] == \"\\\\\" { break }\n                        if chars[k] == \"\\u{07}\" { break }\n                        payload.append(chars[k]); k += 1\n                    }\n                    isClose = payload.isEmpty\n                    if isClose { closes += 1 }\n                    j = k + 2\n                } else { j += 1 }\n            }\n            print(\"ROW \\(i): opens=\\(opens) closes=\\(closes) visible=\\(RenderTests.plain(row))\")\n            if opens != closes {\n                print(\"  ^^ UNBALANCED hyperlink on this row\")\n            }\n        }\n    }\n}\nEOF\ncp /tmp/editxr-repro/LinkWrapTests.swift Tests/editxrTests/LinkWrapTests.swift\nxcrun --sdk macosx swift test --filter LinkWrapTests 2>&1 | tail -30"]

[sandbox]
allow_write = ["${HOME}/.swiftpm", "${HOME}/Library/org.swift.swiftpm", "${HOME}/Library/Caches/org.swift.swiftpm", "/private/var/folders/0y/7kbxp5757s37xmz498dmj4f40000gq/T"]
